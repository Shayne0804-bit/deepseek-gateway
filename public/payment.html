<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0e0c">
  <meta name="app-version" content="{{APP_VERSION}}">
  <title>Paiement du pass — VALARIA Gateway API</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v={{APP_VERSION}}">
  <link rel="stylesheet" href="/assets/theme.css?v={{APP_VERSION}}">
</head>
<body class="public-page payment-page">
  <div class="site-bg" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="site-header">
    <a class="site-brand" href="/portal">
      <img class="brand-logo" src="/assets/logo-mark.svg?v={{APP_VERSION}}" alt="" aria-hidden="true" width="34" height="34">
      <span class="brand-name">VALARIA Gateway</span>
    </a>
    <nav class="site-nav" aria-label="Navigation principale">
      <a href="/portal">Mon espace</a>
      <a href="/">Accueil</a>
    </nav>
  </header>

  <main id="main">
    <section class="portal-login payment-login">
      <div class="panel payment-card" id="payment-card" aria-live="polite">
        <p class="hero-kicker">Paiement du pass</p>
        <h1 id="payment-title">Vérification du paiement…</h1>
        <p class="muted" id="payment-message">Nous vérifions le statut de votre paiement auprès de SasPay.</p>
        <div class="payment-spinner" id="payment-spinner" aria-hidden="true"></div>
        <div class="payment-actions hidden" id="payment-actions">
          <button type="button" class="btn btn-primary btn-block" id="payment-refresh">Actualiser le statut</button>
          <a class="btn btn-ghost btn-block" href="/portal">Retour à mon espace</a>
        </div>
        <p class="small muted" id="payment-order"></p>
      </div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="pass-modal" role="dialog" aria-modal="true" aria-labelledby="pass-modal-title">
    <div class="modal modal-sm">
      <div class="modal-head">
        <h2 id="pass-modal-title">Pass activé</h2>
      </div>
      <div class="modal-body" id="pass-modal-body"></div>
      <div class="modal-foot">
        <a class="btn btn-primary btn-block" href="/portal">Confirmer et retourner au dashboard</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <span>VALARIA Gateway API</span>
    <span class="site-footer-links"><a href="/portal">Mon espace</a><a href="/">Accueil</a></span>
  </footer>

  <script src="/assets/payment.js?v={{APP_VERSION}}" defer></script>
</body>
</html>
