  <title>Val, la mascotte de VALARIA Code</title>
  <style>
    .bob { animation: bob 1.2s steps(2, jump-none) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite, look 9s steps(1) infinite; }
    .tipL { animation: glow 1.6s steps(2, jump-none) infinite; }
    .tipR { animation: glow 1.6s steps(2, jump-none) .8s infinite; }
    .footL { animation: step 1.2s steps(1) infinite; }
    .footR { animation: step 1.2s steps(1) .6s infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 1.2s steps(2, jump-none) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.15); } }
    @keyframes look { 0%, 60% { translate: 0 0; } 61%, 74% { translate: 6px 0; } 75%, 88% { translate: -6px 0; } 89%, 100% { translate: 0 0; } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes step { 0%, 49% { transform: translateY(0); } 50%, 100% { transform: translateY(-3px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .5; } 50% { transform: scaleX(.8); opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
