<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="VALARIA Gateway">
  <title>VALARIA Gateway</title>
  <defs>
    <linearGradient id="vg-tile" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12241B"/>
      <stop offset="1" stop-color="#08100C"/>
    </linearGradient>
    <linearGradient id="vg-stroke" x1="24" y1="26" x2="72" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4FFEE"/>
      <stop offset=".5" stop-color="#7FE3AA"/>
      <stop offset="1" stop-color="#3CCFB4"/>
    </linearGradient>
    <radialGradient id="vg-glow" cx="48" cy="68" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0C674" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F0C674" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .orbit { transform-origin: 48px 48px; animation: spin 16s linear infinite; }
    .v { stroke-dasharray: 46; animation: draw 1s cubic-bezier(.2,.7,.2,1) both; }
    .v-r { animation-delay: .12s; }
    .pkt { stroke-dasharray: 7 80; stroke-dashoffset: 7; animation: flow 3.2s cubic-bezier(.5,0,.3,1) 1.1s infinite; }
    .pkt-r { animation-delay: 1.9s; }
    .src { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
    .src-r { animation-delay: .1s; }
    .core { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1) .7s both, beat 3.2s ease-in-out 1.6s infinite; }
    .halo { animation: halo 3.2s ease-in-out 1.6s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes draw { from { stroke-dashoffset: 46; } to { stroke-dashoffset: 0; } }
    @keyframes flow { 0% { stroke-dashoffset: 7; opacity: 0; } 12% { opacity: 1; } 55%, 100% { stroke-dashoffset: -46; opacity: 0; } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes halo { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pkt { display: none; }
    }
  </style>
  <rect x="1.5" y="1.5" width="93" height="93" rx="28" fill="url(#vg-tile)" stroke="#2C4A3A" stroke-width="2"/>
  <g class="orbit">
    <circle cx="48" cy="48" r="36" stroke="#7FE3AA" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M48 12a36 36 0 0 1 31.2 18" stroke="#7FE3AA" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="79.2" cy="30" r="2.4" fill="#3CCFB4"/>
  </g>
  <circle class="halo" cx="48" cy="68" r="22" fill="url(#vg-glow)"/>
  <path class="v" d="M26 28 48 68" stroke="url(#vg-stroke)" stroke-width="9" stroke-linecap="round"/>
  <path class="v v-r" d="M70 28 48 68" stroke="url(#vg-stroke)" stroke-width="9" stroke-linecap="round"/>
  <path class="pkt" d="M26 28 48 68" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path class="pkt pkt-r" d="M70 28 48 68" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle class="src" cx="26" cy="28" r="3" fill="#E4FFEE"/>
  <circle class="src src-r" cx="70" cy="28" r="3" fill="#E4FFEE"/>
  <circle class="core" cx="48" cy="68" r="7" fill="#F0C674" stroke="#08100C" stroke-width="2.5"/>
</svg>
