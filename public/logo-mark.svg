  <style>
    .d { transform-box: fill-box; transform-origin: center; animation: in 1.1s cubic-bezier(.2,.8,.2,1) var(--i) both; }
    .tw { animation: in 1.1s cubic-bezier(.2,.8,.2,1) var(--i) both, tw 2.8s ease-in-out calc(var(--i) + 1.4s) infinite; }
    .core { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out 1.2s infinite; }
    @keyframes in { from { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }
    @keyframes tw { 50% { opacity: .35; } }
    @keyframes pulse { 50% { opacity: .9; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) { .d, .tw, .core { animation: none; } }
  </style>
